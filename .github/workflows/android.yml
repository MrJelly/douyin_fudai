name: Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish the current main revision
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-33' 'build-tools;33.0.1'
      - run: bash ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-33' 'build-tools;33.0.1'
      - name: Check version and restore private signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          count=$(git rev-list --count "$GITHUB_SHA")
          [[ "$count" =~ ^[1-9][0-9]*$ ]]
          patch=$count
          test "$patch" -ge 1
          echo "RELEASE_TAG=v0.0.$patch" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_NAME=0.0.$patch" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$((count + 4))" >> "$GITHUB_ENV"
          test -n "$KEYSTORE"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleRelease --no-daemon
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/douyin_fudai-${RELEASE_TAG}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish and keep only this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main; skipping obsolete release."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --notes "抖音福袋助手安装包。"

          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | [.id, .tag_name] | @tsv' > "$RUNNER_TEMP/releases.tsv"
          while IFS=$'\t' read -r id tag; do
            if [ "$tag" != "$RELEASE_TAG" ]; then
              gh api --method DELETE "repos/$GH_REPO/releases/$id"
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            fi
          done < "$RUNNER_TEMP/releases.tsv"
          gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/tags.txt"
          while IFS= read -r tag; do
            if [ "$tag" != "$RELEASE_TAG" ]; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            fi
          done < "$RUNNER_TEMP/tags.txt"
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' > "$RUNNER_TEMP/runs.txt"
          while IFS= read -r id; do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then
              gh api --method DELETE "repos/$GH_REPO/actions/runs/$id"
            fi
          done < "$RUNNER_TEMP/runs.txt"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
